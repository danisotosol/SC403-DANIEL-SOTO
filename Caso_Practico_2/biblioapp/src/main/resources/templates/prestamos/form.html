<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo prestamo | BiblioApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div th:replace="~{fragments/header :: navbar}"></div>

<main class="container my-4" style="max-width: 720px;">
    <h1 class="mb-4"><i class="bi bi-journal-plus me-2"></i>Registrar prestamo</h1>

    <form method="post" th:object="${prestamo}" th:action="@{/prestamos}">

        <div class="mb-3">
            <label class="form-label">Libro (solo con ejemplares disponibles)</label>
            <!--
              name="libro" sin th:field: Spring convierte el id que manda el
              select al objeto Libro real gracias al DomainClassConverter que
              registra Spring Data al existir LibroRepository.
            -->
            <select class="form-select" name="libro"
                    th:classappend="${#fields.hasErrors('libro')} ? 'is-invalid'" required>
                <option value="">-- Seleccionar libro --</option>
                <option th:each="l : ${libros}" th:value="${l.id}"
                        th:text="${l.titulo} + ' - ' + ${l.autor} + ' (' + ${l.ejemplaresDisponibles} + ' disp.)'">
                    Libro
                </option>
            </select>
            <div class="invalid-feedback" th:errors="*{libro}">Error</div>
        </div>

        <div class="mb-3">
            <label class="form-label">Lector</label>
            <select class="form-select" name="usuario"
                    th:classappend="${#fields.hasErrors('usuario')} ? 'is-invalid'" required>
                <option value="">-- Seleccionar usuario --</option>
                <option th:each="u : ${usuarios}" th:value="${u.id}"
                        th:text="${u.nombreCompleto} + ' (' + ${u.username} + ' - ' + ${u.rol} + ')'">
                    Usuario
                </option>
            </select>
            <div class="invalid-feedback" th:errors="*{usuario}">Error</div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Fecha del prestamo</label>
                <!-- type="date" + th:field convierte solo a LocalDate -->
                <input type="date" class="form-control"
                       th:classappend="${#fields.hasErrors('fechaPrestamo')} ? 'is-invalid'"
                       th:field="*{fechaPrestamo}">
                <div class="invalid-feedback" th:errors="*{fechaPrestamo}">Error</div>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Devolucion esperada</label>
                <input type="date" class="form-control"
                       th:classappend="${#fields.hasErrors('fechaDevolucionEsperada')} ? 'is-invalid'"
                       th:field="*{fechaDevolucionEsperada}">
                <div class="invalid-feedback" th:errors="*{fechaDevolucionEsperada}">Error</div>
                <div class="form-text">Por defecto, 14 dias despues del prestamo.</div>
            </div>
        </div>

        <div class="d-flex justify-content-between mt-3">
            <a class="btn btn-secondary" th:href="@{/prestamos}">
                <i class="bi bi-arrow-left me-1"></i> Cancelar
            </a>
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-check-circle me-1"></i> Registrar prestamo
            </button>
        </div>
    </form>
</main>

<footer th:replace="~{fragments/header :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
