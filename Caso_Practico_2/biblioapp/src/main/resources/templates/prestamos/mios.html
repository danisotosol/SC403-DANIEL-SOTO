<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis prestamos | BiblioApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div th:replace="~{fragments/header :: navbar}"></div>

<main class="container my-4">
    <h1 class="mb-1">Mis prestamos</h1>
    <p class="text-muted">
        Solo los prestamos del usuario logueado. La consulta filtra por el
        username del Principal, no por un parametro de la URL.
    </p>

    <div class="table-responsive" th:if="${!prestamos.isEmpty()}">
        <table class="table table-hover align-middle">
            <thead class="table-light">
                <tr>
                    <th>Libro</th>
                    <th>Prestado</th>
                    <th>Vence</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="p : ${prestamos}">
                    <td>
                        <a th:href="@{/libros/{id}(id=${p.libro.id})}" th:text="${p.libro.titulo}">Titulo</a>
                        <div class="text-muted small" th:text="${p.libro.autor}">Autor</div>
                    </td>
                    <td th:text="${#temporals.format(p.fechaPrestamo, 'dd/MM/yyyy')}">fecha</td>
                    <td th:text="${#temporals.format(p.fechaDevolucionEsperada, 'dd/MM/yyyy')}">fecha</td>
                    <td>
                        <span class="badge bg-success" th:if="${p.devuelto}">Devuelto</span>
                        <span class="badge bg-danger" th:if="${p.atrasado}"
                              th:text="'Atrasado ' + ${p.diasAtraso} + ' dias'">Atrasado</span>
                        <span class="badge bg-secondary" th:if="${!p.devuelto and !p.atrasado}">En plazo</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="alert alert-info" th:if="${prestamos.isEmpty()}">
        <i class="bi bi-info-circle me-2"></i> No tenes prestamos registrados.
        <a href="/libros">Ver catalogo</a>
    </div>
</main>

<footer th:replace="~{fragments/header :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
