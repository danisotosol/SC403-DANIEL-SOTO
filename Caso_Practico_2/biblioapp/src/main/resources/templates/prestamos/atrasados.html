<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prestamos atrasados | BiblioApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div th:replace="~{fragments/header :: navbar}"></div>

<main class="container my-4">

    <h1 class="mb-1"><i class="bi bi-alarm me-2 text-danger"></i>Prestamos atrasados</h1>
    <p class="text-muted">
        Al <span th:text="${#temporals.format(hoy, 'dd/MM/yyyy')}">hoy</span>:
        <span class="badge bg-danger" th:text="${prestamos.size()}">0</span> sin devolver
        con la fecha limite vencida. Ordenados del atraso mas viejo al mas nuevo.
    </p>

    <div th:replace="~{fragments/header :: alertas}"></div>

    <div class="table-responsive" th:if="${!prestamos.isEmpty()}">
        <table class="table table-hover align-middle">
            <thead class="table-light">
                <tr>
                    <th>#</th>
                    <th>Libro</th>
                    <th>Lector</th>
                    <th>Contacto</th>
                    <th>Vencio</th>
                    <th>Dias de atraso</th>
                    <th class="text-end">Accion</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="p : ${prestamos}" class="table-danger">
                    <td th:text="${p.id}">1</td>
                    <td>
                        <a th:href="@{/libros/{id}(id=${p.libro.id})}" th:text="${p.libro.titulo}">Titulo</a>
                        <div class="text-muted small" th:text="${p.libro.isbn}">ISBN</div>
                    </td>
                    <td th:text="${p.usuario.nombreCompleto}">Nombre</td>
                    <td class="small" th:text="${p.usuario.email}">mail</td>
                    <td th:text="${#temporals.format(p.fechaDevolucionEsperada, 'dd/MM/yyyy')}">fecha</td>
                    <td><span class="badge bg-dark" th:text="${p.diasAtraso}">0</span></td>
                    <td class="text-end">
                        <form th:action="@{/prestamos/{id}/devolver(id=${p.id})}" method="post">
                            <button class="btn btn-sm btn-outline-success" type="submit">
                                <i class="bi bi-arrow-return-left me-1"></i>Registrar devolucion
                            </button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="alert alert-success" th:if="${prestamos.isEmpty()}">
        <i class="bi bi-check-circle me-2"></i> No hay prestamos atrasados.
    </div>

    <a class="btn btn-secondary" th:href="@{/prestamos}">
        <i class="bi bi-arrow-left me-1"></i> Volver a prestamos
    </a>
</main>

<footer th:replace="~{fragments/header :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
