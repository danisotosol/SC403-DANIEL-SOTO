<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso denegado | BiblioApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div th:replace="~{fragments/header :: navbar}"></div>

<main class="container my-5 text-center" style="max-width: 560px;">
    <div class="card shadow border-0">
        <div class="card-body p-5">
            <i class="bi bi-shield-exclamation" style="font-size: 3.5rem; color: #FB7185;"></i>
            <h1 class="h3 mt-3 mb-2">403 - Acceso denegado</h1>
            <p class="text-muted">
                Tu sesion es valida, pero tu rol no alcanza para esta accion.
                Administrar el catalogo, registrar prestamos o ver los
                atrasados requiere el rol <strong>BIBLIOTECARIO</strong>;
                con rol <strong>LECTOR</strong> solo se consulta el catalogo
                y los prestamos propios.
            </p>
            <div class="d-flex gap-2 justify-content-center mt-3">
                <a class="btn btn-primary" href="/libros">
                    <i class="bi bi-arrow-left me-1"></i> Volver al catalogo
                </a>
                <a class="btn btn-outline-secondary" href="/prestamos/mios">Mis prestamos</a>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/header :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
