<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<!--
  Navbar reutilizable: <div th:replace="~{fragments/header :: navbar}"></div>
  sec:authorize / sec:authentication vienen de thymeleaf-extras-springsecurity6.
  Ojo: ocultar un link es COSMETICO; lo que protege de verdad es el
  @PreAuthorize del controller.
-->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark brand-bg px-4 shadow-sm">
    <a class="navbar-brand fw-bold" href="/">
        <i class="bi bi-book-half me-2"></i>BiblioApp
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="/">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="/libros">Catalogo</a></li>
            <li class="nav-item" sec:authorize="isAuthenticated()">
                <a class="nav-link" href="/prestamos/mios">Mis prestamos</a>
            </li>
            <li class="nav-item" sec:authorize="hasRole('BIBLIOTECARIO')">
                <a class="nav-link" href="/prestamos">Prestamos</a>
            </li>
            <li class="nav-item" sec:authorize="hasRole('BIBLIOTECARIO')">
                <a class="nav-link" href="/prestamos/atrasados">Atrasados</a>
            </li>
        </ul>
        <ul class="navbar-nav">
            <li class="nav-item" sec:authorize="isAuthenticated()">
                <span class="nav-link text-white-50">
                    <i class="bi bi-person-circle me-1"></i>
                    <span sec:authentication="name">usuario</span>
                    <span class="badge bg-light text-dark ms-1"
                          sec:authentication="principal.authorities">rol</span>
                </span>
            </li>
            <li class="nav-item" sec:authorize="isAuthenticated()">
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-sm btn-outline-light">
                        <i class="bi bi-box-arrow-right me-1"></i>Salir
                    </button>
                </form>
            </li>
            <li class="nav-item" sec:authorize="isAnonymous()">
                <a class="nav-link" href="/login">
                    <i class="bi bi-box-arrow-in-right me-1"></i>Iniciar sesion
                </a>
            </li>
        </ul>
    </div>
</nav>

<footer th:fragment="footer" class="footer-curso">
    <p>BiblioApp - Caso Practico 2 - SC-403</p>
    <p class="small text-muted">Universidad Fidelitas</p>
</footer>

<!-- Alertas flash reutilizables -->
<div th:fragment="alertas">
    <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${ok}">
        <i class="bi bi-check-circle me-2"></i><span th:text="${ok}">ok</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" role="alert" th:if="${error}">
        <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${error}">error</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

</body>
</html>
