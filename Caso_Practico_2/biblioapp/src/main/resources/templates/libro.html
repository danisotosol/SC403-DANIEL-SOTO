<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del libro | BiblioApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div th:replace="~{fragments/header :: navbar}"></div>

<main class="container my-4" style="max-width: 720px;">

    <div class="alert alert-warning" th:if="${libro == null}">
        <i class="bi bi-exclamation-triangle me-2"></i> Ese libro no existe.
        <a href="/libros">Volver al catalogo</a>
    </div>

    <div class="card shadow border-0" th:if="${libro != null}">
        <div class="card-body p-4">
            <span class="badge bg-secondary" th:text="${libro.categoria}">Categoria</span>
            <h1 class="h3 mt-2 brand-accent" th:text="${libro.titulo}">Titulo</h1>
            <p class="text-muted mb-4">
                <i class="bi bi-person me-1"></i><span th:text="${libro.autor}">Autor</span>
            </p>

            <dl class="row mb-0">
                <dt class="col-sm-4">ISBN</dt>
                <dd class="col-sm-8" th:text="${libro.isbn}">000</dd>

                <dt class="col-sm-4">Anio de publicacion</dt>
                <dd class="col-sm-8" th:text="${libro.anioPublicacion}">2000</dd>

                <dt class="col-sm-4">Ejemplares totales</dt>
                <dd class="col-sm-8" th:text="${libro.ejemplaresTotales}">0</dd>

                <dt class="col-sm-4">Disponibles ahora</dt>
                <dd class="col-sm-8">
                    <span class="badge"
                          th:classappend="${libro.disponible} ? 'bg-success' : 'bg-danger'"
                          th:text="${libro.ejemplaresDisponibles}">0</span>
                </dd>
            </dl>

            <div class="d-flex gap-2 mt-4">
                <a class="btn btn-secondary" href="/libros">
                    <i class="bi bi-arrow-left me-1"></i> Volver
                </a>
                <a class="btn btn-warning" th:href="@{/libros/{id}/editar(id=${libro.id})}"
                   sec:authorize="hasRole('BIBLIOTECARIO')">
                    <i class="bi bi-pencil me-1"></i> Editar
                </a>
                <a class="btn btn-primary" th:href="@{/prestamos/nuevo}"
                   sec:authorize="hasRole('BIBLIOTECARIO')" th:if="${libro.disponible}">
                    <i class="bi bi-journal-plus me-1"></i> Prestar
                </a>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/header :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
