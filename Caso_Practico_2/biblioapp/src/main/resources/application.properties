spring.application.name=biblioapp
# 8080 y 8081 suelen estar ocupados en mi maquina (cursosapp / eventapp),
# asi que BiblioApp corre en 8082. Cambiar aca o con --server.port=.
server.port=${SERVER_PORT:8082}

# Recargar plantillas Thymeleaf sin reiniciar (dev)
spring.thymeleaf.cache=false

logging.level.root=INFO

# Base de datos (MySQL/MariaDB local, con variables de entorno y defaults)
# nullCatalogMeansCurrent=true: sin este parametro, el driver MySQL le
# reporta a Hibernate las tablas de TODAS las bases del servidor. Si en la
# misma instancia hay otra base con una tabla "usuarios" (ej. cursoswebdb de
# la Clase 12), Hibernate cree que ya existe, intenta un ALTER en vez del
# CREATE, falla, y la FK usuario_id de prestamos nunca se crea.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/biblioappdb?nullCatalogMeansCurrent=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate: crea y actualiza las tablas libros, usuarios y prestamos
# a partir de las @Entity. No escribir CREATE TABLE a mano.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT para la API REST. El secreto necesita 32+ caracteres para HS256.
app.jwt.secret=${JWT_SECRET:clave-secreta-de-desarrollo-biblioapp-cambiar-en-produccion}
app.jwt.expiration-ms=3600000
